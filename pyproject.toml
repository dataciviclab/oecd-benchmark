[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataciviclab-oecd-benchmark"
version = "0.1.0"
description = "Dataset OECD per benchmark internazionale: emissioni, PIL, salute, istruzione, lavoro, fisco"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

# duckdb: dipendenza runtime (usata dai test SQL e dal motore).
# toolkit è CLI esterno → vive nell'extra `pipeline`.
# lab-connectors arriva transitivamente da toolkit (non si dichiara).
dependencies = [
    "duckdb>=1.5.3,<2",
]

# Nessun package Python: il repo è dati + SQL + scripts.

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.61",
    "plotly>=5.18",
    "altair>=6.2",
    "pandas>=3.0",
    "duckdb>=1.5.3",
    "lab-connectors[duckdb] @ git+https://github.com/dataciviclab/lab-connectors.git",
]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

pipeline = [
    "dataciviclab-toolkit @ git+https://github.com/dataciviclab/toolkit.git",
]

[project.urls]
Home = "https://github.com/dataciviclab/oecd-benchmark"

[tool.pytest.ini_options]
markers = [
    "contract: interfaccia pubblica, artifact format, contratto API, path contract, output CI",
    "policy: regola Lab non ovvia o comportamento cross-component",
    "regression: bug fix documentato in issue/PR",
    "smoke: test che fa chiamate reali (richiede connettivita')",
    "pure_unit: pure logic, zero side effects",
]

[tool.toolkit.extends]
source_id = "oecd-benchmark"
