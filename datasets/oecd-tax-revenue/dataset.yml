root: "../../out"
schema_version: 1

dataset:
  name: "oecd_tax_revenue"
  source_id: "oecd"
  tags: [fisco, entrate, tasse, oecd]
  category: economia
  years: [2026]
  time_coverage:
    start_year: 2000
    end_year: 2023

raw:
  output_policy: overwrite
  sources:
    - name: "sdmx_tax_rev"
      type: "sdmx"
      args:
        agency: "OECD.CTP.TPS"
        flow: "DSD_REV_OECD@DF_REVITA"
        version: "2.1"
        filters:
          FREQ: "A"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
    nullstr: "Not applicable"
    ignore_errors: true
  required_columns: [anno, ref_area, paese, misura, settore, unita, valore]
  validate:
    not_null: [anno, misura]
    min_rows: 50

mart:
  tables:
    - name: "mart_italia"
      sql: "sql/mart_italia.sql"
    - name: "mart_benchmark"
      sql: "sql/mart_benchmark.sql"
  required_tables: ["mart_italia", "mart_benchmark"]
  validate:
    table_rules:
      mart_italia:
        not_null: [anno, misura]
        min_rows: 20
      mart_benchmark:
        not_null: [anno, paese]
        min_rows: 10

validation:
  fail_on_error: true
