root: "../../out"
schema_version: 1

dataset:
  name: "oecd_tax_revenue"
  source_id: "oecd"
  tags: [fisco, entrate, tasse, oecd]
  category: economia
  years: [2026]
  time_coverage:
    start_year: 1965
    end_year: 2022

raw:
  output_policy: overwrite
  sources:
    - name: "sdmx_tax_rev"
      type: "sdmx"
      args:
        agency: "OECD.CTP.TPS"
        flow: "DSD_REV_COMP_OECD@DF_RSOECD"
        version: "1.0"
        filters:
          FREQ: "A"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
    all_varchar: true  # codici SDMX: evita sniffing errato (es. SEX=F → BOOLEAN)
    quote: '"'
    escape: '"'  # CSV OECD: auto-detect sbaglia il dialect (righe perse)
    nullstr: "Not applicable"
  required_columns: [anno, ref_area, paese, misura, settore, unita, valore, revenue_category, obs_status]
  validate:
    primary_key: [anno, ref_area, misura, settore, revenue_category, revenue_specific, unita, obs_status]
    not_null: [anno, misura]
    min_rows: 50

mart:
  tables:
    - name: "mart_italia"
      sql: "sql/mart_italia.sql"
    - name: "mart_benchmark"
      sql: "sql/mart_benchmark.sql"
  required_tables: ["mart_italia", "mart_benchmark"]
  validate:
    table_rules:
      mart_italia:
        primary_key: [anno, ref_area, misura, settore, unita]
        not_null: [anno, misura]
        min_rows: 20
      mart_benchmark:
        primary_key: [anno, ref_area, misura]
        not_null: [anno, paese]
        min_rows: 10

validation:
  fail_on_error: true
