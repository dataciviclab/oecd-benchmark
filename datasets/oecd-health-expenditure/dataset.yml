root: "../../out"
schema_version: 1

dataset:
  name: "oecd_health_expenditure"
  source_id: "oecd"
  tags: [salute, spesa-sanitaria, oecd]
  category: salute
  years: [2026]
  time_coverage:
    start_year: 1970
    end_year: 2025

raw:
  output_policy: overwrite
  sources:
    - name: "sdmx_sha"
      type: "sdmx"
      args:
        agency: "OECD.ELS.HD"
        flow: "DSD_SHA@DF_SHA"
        version: "1.1"
        filters:
          REF_AREA: ["ITA", "DEU", "FRA", "ESP", "GBR", "USA", "JPN", "CAN"]
          FREQ: "A"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
    all_varchar: true  # codici SDMX: evita sniffing errato (es. SEX=F → BOOLEAN)
    quote: '"'
    escape: '"'  # il CSV OECD usa virgolette; l'auto-detect sbaglia il dialect
  required_columns: [anno, ref_area, paese, misura, unita, financing_scheme, function_code, mode_provision, price_base, valore]
  validate:
    primary_key: [anno, ref_area, misura, unita, financing_scheme, financing_scheme_rev, function_code, mode_provision, provider, factor_provision, asset_type, price_base]
    not_null: [anno, misura]
    min_rows: 50

mart:
  tables:
    - name: "mart_italia"
      sql: "sql/mart_italia.sql"
    - name: "mart_benchmark"
      sql: "sql/mart_benchmark.sql"
  required_tables: ["mart_italia", "mart_benchmark"]
  validate:
    table_rules:
      mart_italia:
        primary_key: [anno, ref_area, misura, unita, financing_scheme, function_code, provider]
        not_null: [anno, misura]
        min_rows: 30
      mart_benchmark:
        primary_key: [anno, ref_area, misura, unita]
        not_null: [anno, paese]
        min_rows: 20

validation:
  fail_on_error: true
