root: "../../out"
schema_version: 1

dataset:
  name: "oecd_fua_ghg"
  source_id: "oecd"
  tags: [ambiente, emissioni, co2, citta, fua, oecd]
  category: ambiente
  years: [2026]
  time_coverage:
    start_year: 1990
    end_year: 2024

raw:
  output_policy: overwrite
  sources:
    - name: "sdmx_fua_ghg"
      type: "sdmx"
      args:
        agency: "OECD.CFE.EDS"
        flow: "DSD_FUA_ENV@DF_GHG"
        version: "1.5"
        filters:
          FREQ: "A"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
    all_varchar: true  # codici SDMX: evita sniffing errato (es. SEX=F → BOOLEAN)
    quote: '"'
    escape: '"'  # CSV OECD: auto-detect sbaglia il dialect (righe perse)
    nullstr: "Not applicable"
  required_columns: [anno, fua_code, citta, pollutante, unita, livello, valore]
  validate:
    primary_key: [anno, fua_code, pollutante, unita, livello]
    not_null: [anno, fua_code]
    min_rows: 100

mart:
  tables:
    - name: "mart_italia"
      sql: "sql/mart_italia.sql"
    - name: "mart_benchmark"
      sql: "sql/mart_benchmark.sql"
  required_tables: ["mart_italia", "mart_benchmark"]
  validate:
    table_rules:
      mart_italia:
        primary_key: [anno, fua_code, pollutante, unita]
        not_null: [anno, fua_code, citta]
        min_rows: 50
      mart_benchmark:
        primary_key: [anno, fua_code, pollutante, unita]
        not_null: [anno, citta]
        min_rows: 30

validation:
  fail_on_error: true
