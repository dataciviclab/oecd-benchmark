root: "../../out"
schema_version: 1

dataset:
  name: "oecd_taxing_wages"
  source_id: "oecd"
  tags: [fisco, cuneo-fiscale, lavoro, oecd]
  category: economia
  years: [2026]
  time_coverage:
    start_year: 2000
    end_year: 2025

raw:
  output_policy: overwrite
  sources:
    - name: "sdmx_taxing_wages"
      type: "sdmx"
      args:
        agency: "OECD.CTP.TPS"
        flow: "DSD_TAX_WAGES_COMP@DF_TW_COMP"
        version: "2.1"
        filters:
          FREQ: "A"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
    all_varchar: true  # codici SDMX: evita sniffing errato (es. SEX=F → BOOLEAN)
    quote: '"'
    escape: '"'  # CSV OECD: auto-detect sbaglia il dialect (righe perse)
    nullstr: "Not applicable"
  required_columns: [anno, ref_area, paese, misura, unita, tipo_famiglia, reddito_principale, reddito_secondo, stato_civile, valore]
  validate:
    primary_key: [anno, ref_area, misura, unita, tipo_famiglia, reddito_principale, reddito_secondo, stato_civile]
    not_null: [anno, misura]
    min_rows: 50

mart:
  tables:
    - name: "mart_italia"
      sql: "sql/mart_italia.sql"
    - name: "mart_benchmark"
      sql: "sql/mart_benchmark.sql"
  required_tables: ["mart_italia", "mart_benchmark"]
  validate:
    table_rules:
      mart_italia:
        primary_key: [anno, ref_area, misura, tipo_famiglia, unita]
        not_null: [anno, misura]
        min_rows: 20
      mart_benchmark:
        primary_key: [anno, ref_area, misura, unita]
        not_null: [anno, paese]
        min_rows: 10

validation:
  fail_on_error: true
