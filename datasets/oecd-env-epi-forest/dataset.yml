root: "../../out"
schema_version: 1

dataset:
  name: "oecd_forest"
  source_id: "oecd"
  tags: [ambiente, foreste, boschi, oecd]
  category: ambiente
  years: [2026]
  time_coverage:
    start_year: 1950
    end_year: 2015

raw:
  output_policy: overwrite
  sources:
    - name: "sdmx_forest"
      type: "sdmx"
      args:
        agency: "OECD.ENV.EPI"
        flow: "DSD_FOREST@DF_FOREST"
        version: "1.0"
        filters:
          REF_AREA: "ITA"
          FREQ: "A"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
    all_varchar: true  # codici SDMX: evita sniffing errato (es. SEX=F → BOOLEAN)
    quote: '"'
    escape: '"'  # CSV OECD: auto-detect sbaglia il dialect (righe perse)
  required_columns: [anno, indicatore, indicatore_label, unita, valore]
  validate:
    primary_key: [anno, indicatore, unita]
    not_null: [anno, indicatore]
    min_rows: 40

mart:
  tables:
    - name: "mart_forest_italia"
      sql: "sql/mart_forest_italia.sql"
  required_tables: ["mart_forest_italia"]
  validate:
    table_rules:
      mart_forest_italia:
        primary_key: [anno, indicatore, unita]
        not_null: [anno, indicatore]
        min_rows: 20

validation:
  fail_on_error: true
