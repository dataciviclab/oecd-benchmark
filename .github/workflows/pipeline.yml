name: Pipeline

on:
  pull_request:
    types: [closed]
    paths:
      - "datasets/**"
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  pipeline:
    if: github.event.pull_request.merged == true || github.event_name != 'pull_request'
    uses: dataciviclab/.github/.github/workflows/pipeline-reusable.yml@main
    with:
      repo-slug: "oecd-benchmark"
      run-command: "make pipeline"
      run-batch-command: "make run-batch"
      detect-paths: "datasets"
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets: inherit
